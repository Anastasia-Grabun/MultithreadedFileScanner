<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>File Scanner</title>
</head>
<body>

<h2>Welcome, <span sec:authentication="name">User</span></h2>

<h3>Start New Scan</h3>

<form th:action="@{/scan}" method="post" th:object="${scanBatchForm}">
    <div th:each="task, iterStat : *{tasks}">
        <fieldset>
            <legend th:text="'Search Task ' + ${iterStat.index + 1}"></legend>

            <label>Directory:
                <input type="text" th:field="*{tasks[__${iterStat.index}__].path}" required />
            </label><br/>

            <label>Pattern:
                <input type="text" th:field="*{tasks[__${iterStat.index}__].mask}" required />
            </label><br/>

            <label>Content contains:
                <input type="text" th:field="*{tasks[__${iterStat.index}__].contentContains}" />
            </label><br/>

            <label>Min Size (bytes):
                <input type="number" th:field="*{tasks[__${iterStat.index}__].minSize}" />
            </label><br/>

            <label>Max Size (bytes):
                <input type="number" th:field="*{tasks[__${iterStat.index}__].maxSize}" />
            </label><br/>

            <label>Modified After (yyyy-MM-dd):
                <input type="text" th:field="*{tasks[__${iterStat.index}__].modifiedAfter}" />
            </label><br/>
        </fieldset>
    </div>

    <button type="submit">Start Scan All Tasks</button>
</form>

<hr/>

<form th:action="@{/cancel}" method="post">
    <button type="submit">Cancel My Tasks</button>
</form>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
